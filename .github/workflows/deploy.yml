name: Deploy MiniLab

# Builds (and encrypts) MiniLab on every push to main.
# If GitHub Pages is turned on (Settings > Pages > Source: GitHub Actions) it is also published there.
# If you use Vercel instead, the Pages steps are skipped automatically.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Security check (no secrets in repo)
        run: npm run check

      - name: Build and encrypt
        run: npm run build
        env:
          MINILAB_SECRET: ${{ secrets.MINILAB_SECRET }}

      - name: Is GitHub Pages turned on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages chua bat (Settings > Pages > Source: GitHub Actions). Bo qua buoc dang web."
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
